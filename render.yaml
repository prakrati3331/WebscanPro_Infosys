services:
  - type: web
    name: webscanpro
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python web_interface.py
    healthCheckPath: /
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.9.16
    autoDeploy: true
